<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stone.io</title>
    <style>
      *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0808; }
      canvas { display: block; cursor: default; touch-action: none; }

      .overlay {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 10;
        font-family: 'Georgia', 'Times New Roman', serif;
        color: #e8dcc8;
      }
      /* Lobby uses an animated canvas backdrop; death screen a flat dim layer */
      #lobby-overlay { background: #0a0808; }
      #lobby-canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
      }
      #dead-overlay { background: rgba(0,0,0,0.6); }

      .overlay-box {
        position: relative;
        z-index: 1;
        background: rgba(18,12,7,0.82);
        border: 1px solid rgba(200,168,75,0.55);
        border-radius: 14px;
        padding: 40px 48px;
        min-width: 340px;
        text-align: center;
        backdrop-filter: blur(3px);
        box-shadow: 0 12px 48px rgba(0,0,0,0.55), inset 0 0 40px rgba(200,168,75,0.05);
      }

      /* Lobby title — large stone kanji + wordmark */
      .kanji {
        font-size: 84px;
        line-height: 1;
        color: #D4B45A;
        text-shadow: 0 2px 12px rgba(200,168,75,0.45), 0 0 2px rgba(255,240,200,0.6);
        margin-bottom: 4px;
        font-weight: 700;
      }
      .wordmark {
        font-size: 22px;
        letter-spacing: 6px;
        color: #C8A84B;
        margin-bottom: 4px;
      }
      .subtitle {
        font-size: 11px;
        color: #8a7048;
        margin-bottom: 28px;
        letter-spacing: 3px;
        font-family: monospace;
      }

      .overlay-box input[type="text"] {
        display: block;
        width: 100%;
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(200,168,75,0.4);
        border-radius: 6px;
        color: #f0e6d2;
        font-family: 'Georgia', serif;
        font-size: 16px;
        padding: 10px 14px;
        margin-bottom: 18px;
        outline: none;
        text-align: center;
      }
      .overlay-box input[type="text"]::placeholder { color: #6a543a; }
      .overlay-box input[type="text"]:focus { border-color: rgba(200,168,75,0.9); }

      .btn {
        display: inline-block;
        padding: 12px 44px;
        background: linear-gradient(180deg, rgba(74,52,28,0.95), rgba(48,32,16,0.95));
        border: 1px solid rgba(200,168,75,0.7);
        border-radius: 6px;
        color: #E6C868;
        font-family: 'Georgia', serif;
        font-size: 15px;
        letter-spacing: 4px;
        cursor: pointer;
        transition: background 0.18s, box-shadow 0.18s, transform 0.05s;
      }
      .btn:hover {
        background: linear-gradient(180deg, rgba(104,76,40,0.98), rgba(68,46,22,0.98));
        box-shadow: 0 0 18px rgba(200,168,75,0.35);
      }
      .btn:active { transform: translateY(1px); }

      .dead-title {
        font-size: 30px;
        letter-spacing: 4px;
        color: #C8A84B;
        margin-bottom: 2px;
      }
      .dead-icon { font-size: 40px; margin-bottom: 6px; }
      .dead-stats {
        margin: 16px 0 18px;
        line-height: 2.2;
        font-size: 13px;
        color: #9a7c50;
        font-family: monospace;
      }
      .dead-stats span { color: #C8A84B; font-size: 16px; }
      .dead-countdown {
        font-size: 11px;
        color: #6a543a;
        letter-spacing: 1px;
        font-family: monospace;
      }
      .dead-countdown span { color: #a88a58; }

      /* Speaker toggle — top-right of canvas */
      #sound-btn {
        position: fixed;
        top: 12px;
        right: 12px;
        z-index: 8;
        width: 38px;
        height: 38px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
        background: rgba(18,12,7,0.7);
        border: 1px solid rgba(200,168,75,0.4);
        border-radius: 8px;
        color: #C8A84B;
        cursor: pointer;
        transition: background 0.15s, border-color 0.15s;
      }
      #sound-btn:hover { background: rgba(40,28,16,0.85); border-color: rgba(200,168,75,0.75); }
      #sound-btn.muted { color: #6a543a; }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>

    <button id="sound-btn" title="Toggle sound">🔊</button>

    <div id="lobby-overlay" class="overlay">
      <canvas id="lobby-canvas"></canvas>
      <div class="overlay-box">
        <div class="kanji">石</div>
        <div class="wordmark">STONE.IO</div>
        <div class="subtitle">absorb · grow · survive</div>
        <input id="nickname-input" type="text" maxlength="16" placeholder="enter nickname" autocomplete="off" />
        <button id="play-btn" class="btn">PLAY</button>
      </div>
    </div>

    <div id="dead-overlay" class="overlay" style="display:none">
      <div class="overlay-box">
        <div id="dead-icon" class="dead-icon">⚙</div>
        <div class="dead-title">CRUSHED</div>
        <div id="dead-cause" class="subtitle">crushed by a gear</div>
        <div class="dead-stats">
          peak radius &nbsp;<span id="dead-radius">0</span><br>
          rank &nbsp;<span id="dead-rank">--</span>
        </div>
        <div class="dead-countdown">respawning in <span id="dead-countdown">2.0</span>s</div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
